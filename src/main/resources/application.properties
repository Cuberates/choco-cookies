spring.application.name=choco-cookies

# spring.datasource.driver-class-name=org.postgresql.Driver

# Load local datasource settings from .env; deployment can provide the same variables directly.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation; Hibernate only checks entity mappings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Flyway creates the JDBC session tables alongside the application schema.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
