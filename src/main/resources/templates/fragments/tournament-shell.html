<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="header">
  <div class="header-left">

    <nav class="primary-nav" aria-label="Primary"><a href="/catalog">Ball Database</a><a href="/tournaments">Tournaments</a></nav>
